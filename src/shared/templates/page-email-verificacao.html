<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
    <title>Verificando Email - Coisa Rápida</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Verificando seu Email</h1>
        <p>Por favor, aguarde enquanto confirmamos seu email...</p>
        <div class="spinner"></div>
        <p id="status">Processando...</p>
    </div>

    <script type="module">
        async function verificarEmail() {
            try {
                const baseUrl = '{{API_URL}}';
                const endpoint = baseUrl + '/api/v1/verificacao/email/verificar';

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: '{{TOKEN}}'
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    document.querySelector('.container').innerHTML = `
                        <h1 class="success">✅ Email Verificado!</h1>
                        <p>Seu email foi confirmado com sucesso.</p>
                    `;
                } else {
                    throw new Error(result.message || 'Erro na verificação');
                }
            } catch (error) {
                console.error('Erro:', error);
                document.querySelector('.container').innerHTML = `
                    <h1 class="error">❌ Erro na Verificação</h1>
                    <p>${error.message || 'Erro desconhecido'}</p>
                `;
            }
        }

        await verificarEmail();
    </script>
</body>
</html>
