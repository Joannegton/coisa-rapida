<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro de Verificação - Coisa Rápida</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
            color: #333;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #d32f2f;
        }
        .error-message {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .error-details {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .error-details ul {
            margin: 0;
            padding-left: 20px;
        }
        .error-details li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">❌</div>
        <h1 class="error-title">Link Inválido</h1>
        <div class="error-message">
            <p>Não foi possível verificar seu email.</p>
        </div>
        <div class="error-details">
            <p><strong>Possíveis causas:</strong></p>
            <ul>
                <li>O link de verificação pode estar expirado</li>
                <li>O link pode estar corrompido ou incompleto</li>
                <li>Parâmetros necessários estão ausentes</li>
            </ul>
        </div>
        <p>Por favor, solicite um novo link de verificação.</p>
    </div>
</body>
</html>
